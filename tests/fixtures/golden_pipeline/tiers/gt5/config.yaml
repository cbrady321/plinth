name: gt5_mixed_topology
version: "1.0"
input_source: dataset
dag:
  type: sequential
  name: gt5_root
  children:
    - type: stage
      name: golden_exceptional_structural
    - type: stage
      name: golden_noop
    - type: parallel
      name: golden_branch_parallel
      children:
        - type: stage
          name: golden_branch_a
        - type: stage
          name: golden_branch_b
    - type: stage
      name: golden_join_filter
block_settings:
  gt5_root:
    aggregate_outputs: false
params:
  golden_exceptional_structural: {}
  golden_noop: {}
  golden_branch_a: {}
  golden_branch_b: {}
  golden_join_filter: {}
