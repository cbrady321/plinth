name: gt8_resume_path
version: "1.0"
input_source: dataset
dag:
  type: sequential
  name: gt8_root
  children:
    - type: stage
      name: allowlist_filter
    - type: stage
      name: tag_category
    - type: stage
      name: golden_filter_b
params:
  allowlist_filter:
    allow:
      - a.bin
      - b.bin
  tag_category:
    default_category: gt8_category
  golden_filter_b:
    allow:
      - a.bin
