name: gt3_parallel
version: "1.0"
input_source: dataset
dag:
  type: sequential
  name: gt3_root
  children:
    - type: parallel
      name: split
      children:
        - type: stage
          name: golden_branch_a
        - type: stage
          name: golden_branch_b
    - type: stage
      name: allowlist_filter
params:
  golden_branch_a: {}
  golden_branch_b: {}
  allowlist_filter:
    allow:
      - a.bin
      - b.bin
