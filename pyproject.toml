[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plinth"
dynamic = ["version"]
description = "Reproducible ML data pipelines — DAG runtime, manifest lineage, typed stage contracts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["machine-learning", "mlops", "data-pipeline", "dag", "lineage", "reproducibility", "dataset", "etl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "pandas>=2.2",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/cbrady321/plinth"
Documentation = "https://github.com/cbrady321/plinth/tree/master/docs"
Changelog = "https://github.com/cbrady321/plinth/blob/master/CHANGELOG.md"
Issues = "https://github.com/cbrady321/plinth/issues"

[project.optional-dependencies]
ui = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "httpx>=0.27",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.4.0",
  "import-linter>=2.0",
  "mypy>=1.8",
  "types-PyYAML",
  "pandas-stubs",
  "hypothesis>=6.0",
]

[tool.setuptools.dynamic]
version = { attr = "plinth.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plinth = ["schemas/*.json", "researcher_ui/static/*"]

[project.scripts]
plinth-researcher-ui = "plinth.researcher_ui.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "invariants: contract and policy enforcement tests",
  "golden: golden pipeline equivalence tiers",
  "metamorphic: full-run vs resume equivalence proofs",
  "adoption: import boundary and author audit",
  "unit: hermetic unit tests without full pipeline",
  "property: hypothesis property and fuzz tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "E501"]
"scripts/**" = ["E402", "E501"]
"examples/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/plinth"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
